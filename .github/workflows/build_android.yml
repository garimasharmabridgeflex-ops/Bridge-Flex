name: Build Android App

# Manual, or on a v-prefixed tag — same policy as the iOS release workflow.
# Every run publishes to the live download site, so it should be a deliberate
# act rather than a side effect of pushing a commit.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APK to the download site (uncheck to just build an artifact)'
        type: boolean
        required: false
        default: true
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  # Required for Workload Identity Federation: the job mints a short-lived
  # OIDC token that Google exchanges for credentials. No service account key
  # exists anywhere — the project's org policy forbids creating them
  # (constraints/iam.disableServiceAccountKeyCreation), and this is the
  # keyless alternative it points to.
  id-token: write

jobs:
  build-android:
    name: Build APK & publish to Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check required secrets
        # Keeps the workflow honest about why it skipped, rather than failing
        # with a Gradle error about a missing keystore.
        id: secrets_check
        run: |
          missing=""
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Restore the signing keystore
        # The keystore is the app's identity. Android will not install an
        # update signed by a different key, and the Google Sign-In client is
        # bound to this certificate's SHA-1, so CI must sign with the same key
        # that signed every previous release.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > frontend/android/app/upload-keystore.jks
          cat > frontend/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "keystore restored ($(stat -c%s frontend/android/app/upload-keystore.jks) bytes)"

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build release APK
        # --build-number from the run number for the same reason the iOS
        # workflow does it: Android refuses to install an update whose
        # versionCode isn't higher, and run numbers increase and never reset.
        run: |
          cd frontend
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=USE_LOCAL_BACKEND=false \
            --dart-define=PROJECT_ID=kvision-503115

      - name: Verify the signing certificate
        # Guards against the one failure that is invisible until users complain:
        # an APK signed by the wrong key installs fine on a clean device and
        # only fails as an *update*. Compare against the certificate that signed
        # the published releases.
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          SHA=$("$APKSIGNER" verify --print-certs \
            frontend/build/app/outputs/flutter-apk/app-release.apk \
            | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}')
          echo "signing SHA-1: $SHA"
          EXPECTED="${{ secrets.ANDROID_EXPECTED_SHA1 }}"
          if [ -n "$EXPECTED" ] && [ "$SHA" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $SHA but published releases use $EXPECTED — existing users could not update to this build."
            exit 1
          fi
          if [ -z "$EXPECTED" ]; then
            echo "::warning::ANDROID_EXPECTED_SHA1 not set — signing identity not verified against previous releases."
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BridgeFlex_Android_APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Authenticate to Google Cloud
        # Keyless: exchanges the job's OIDC token for short-lived credentials.
        # The pool provider only trusts this one repository, so a fork or
        # another repo in the org cannot assume this identity.
        if: inputs.publish != false
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/288297326448/locations/global/workloadIdentityPools/github/providers/github'
          service_account: 'bridgeflex-ci-hosting@kvision-503115.iam.gserviceaccount.com'

      - name: Publish to Firebase Hosting
        # Hosting deploys are whole-site and atomic: whatever is in
        # backend/public is what the site becomes. The APK is copied in first so
        # a deploy never removes the download it is meant to publish.
        if: inputs.publish != false
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk backend/public/app-release.apk
          npm install -g firebase-tools
          cd backend
          firebase deploy --only hosting --project kvision-503115 --non-interactive

      - name: Report the published build number
        if: inputs.publish != false
        run: |
          echo "Published versionCode ${{ github.run_number }} to https://kvision-503115.web.app"
          echo "Remote Config's latest_version_code must be raised to ${{ github.run_number }}"
          echo "for existing installs to be prompted to update."
