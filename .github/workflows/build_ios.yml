name: Build iOS App

# Deliberately NOT on every push to main. Each run creates a distribution
# certificate whenever DIST_CERT_P12 is unset, and Apple caps an account at 2 —
# so incidental pushes (docs, seed scripts, web page edits) were exhausting that
# cap and failing. Every run also consumes a TestFlight build slot that expires
# after 90 days. Releases are now deliberate: dispatch manually, or push a
# v-prefixed tag.
#
# To go back to building on every push, add back:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  build-ios:
    name: Build, Sign & Upload iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check required signing secrets
        # Lets this workflow keep running green on every push before the App
        # Store Connect API key exists yet, instead of failing outright.
        # Add APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8
        # (base64 of the .p8 file) and APPLE_TEAM_ID as repo secrets
        # (Settings > Secrets and variables > Actions) to turn on signed
        # builds + automatic TestFlight/App Store Connect upload.
        id: secrets_check
        run: |
          if [ -n "${{ secrets.APPSTORE_API_KEY_ID }}" ] && \
             [ -n "${{ secrets.APPSTORE_API_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APPSTORE_API_KEY_P8 }}" ] && \
             [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed iOS build skipped — missing one or more of APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8, APPLE_TEAM_ID repository secrets."
          fi

      - name: Setup Java
        if: steps.secrets_check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.secrets_check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend
          flutter pub get

      - name: Wire GoogleService-Info.plist and entitlements into the Xcode project
        # A file just sitting in ios/Runner/ isn't enough — Xcode only bundles
        # resources it has a project.pbxproj reference for, and that reference
        # is normally created by dragging the file into Xcode interactively.
        # There's no Xcode UI in CI, so add it programmatically instead
        # (hand-editing project.pbxproj's UUID-linked format by hand is a
        # well-known way to silently corrupt the whole Xcode project).
        #
        # Entitlements are set on the Runner target specifically, NOT as a
        # global `xcodebuild KEY=value` override — a global override also
        # applies to every SPM/CocoaPods dependency target, each of which then
        # looks for Runner/Runner.entitlements relative to its own directory
        # and fails. Signing settings are handled separately by Fastlane's
        # update_code_signing_settings action (see fastlane/Fastfile).
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend/ios
          gem install xcodeproj --no-document
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('Runner.xcodeproj')
            target = project.targets.find { |t| t.name == 'Runner' }
            group = project.main_group['Runner']
            existing = group.files.find { |f| f.path == 'GoogleService-Info.plist' }
            file_ref = existing || group.new_reference('GoogleService-Info.plist')
            unless target.resources_build_phase.files_references.include?(file_ref)
              target.resources_build_phase.add_file_reference(file_ref)
            end
            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            end
            project.save
          "

      - name: Compile Flutter (unsigned) to generate Xcode build config
        # Populates ios/Flutter/Generated.xcconfig with the Dart AOT output and
        # --dart-define values that the signed archive then reuses — the
        # archive re-runs Flutter's build script phase, but reads its config
        # from here rather than from CLI flags of its own.
        if: steps.secrets_check.outputs.ready == 'true'
        # --build-number overrides pubspec.yaml's build number (the "+6" in
        # 1.3.0+6). App Store Connect rejects any upload whose build number
        # isn't strictly higher than the last one accepted for that version,
        # so a hardcoded pubspec value can only ever be uploaded once.
        # github.run_number increments per workflow run and never resets,
        # which satisfies that without needing a commit to bump a version.
        run: |
          cd frontend
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=USE_LOCAL_BACKEND=false --dart-define=PROJECT_ID=kvision-503115

      - name: Create distribution cert + App Store profile, archive, upload to TestFlight
        if: steps.secrets_check.outputs.ready == 'true'
        working-directory: frontend/ios
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional — set these once a distribution certificate exists, so
          # repeat runs reuse it instead of creating a new one each time and
          # hitting Apple's 2-certificate cap. See fastlane/Fastfile.
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          # Throwaway keychain password — the runner is destroyed after the job,
          # so this only needs to be unguessable within this run.
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-bridgeflex
          # Non-interactive output; Fastlane otherwise assumes a TTY.
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
        # The lane's output is captured and re-emitted as ::error:: lines on
        # failure. Workflow logs need a GitHub login to download, but check-run
        # annotations are readable without one, so this is what makes a signing
        # failure diagnosable from outside the browser. It also prints the
        # toolchain versions, because a lane that dies in five seconds is
        # failing before it ever reaches Apple.
        run: |
          set -o pipefail
          ruby --version || true
          which fastlane && fastlane --version || { echo "fastlane not on PATH — installing"; gem install fastlane --no-document; }
          # Validates the key *shape* only, never its contents. A malformed
          # APPSTORE_API_KEY_P8 (raw .p8 pasted instead of base64, or a paste
          # truncated at a wrapped line) makes app_store_connect_api_key raise
          # immediately, which is exactly the kind of sub-ten-second failure
          # this job has been hitting.
          ruby -e 'require "base64"; require "openssl"; OpenSSL::PKey::RSA.new(Base64.decode64(ENV.fetch("APPSTORE_API_KEY_P8")))' \
            && echo "::notice::APPSTORE_API_KEY_P8 decodes to a valid RSA private key" \
            || echo "::error::APPSTORE_API_KEY_P8 is not base64 of a valid .p8 RSA private key"
          # Emitted as annotations rather than plain output so the signing state
          # is readable on the run summary without downloading the log.
          [ -n "$DIST_CERT_P12" ] && echo "::notice::DIST_CERT_P12 is set" || echo "::warning::DIST_CERT_P12 is empty — Apple will be asked for a new certificate"
          [ -n "$DIST_CERT_PASSWORD" ] && echo "::notice::DIST_CERT_PASSWORD is set" || echo "::warning::DIST_CERT_PASSWORD is empty"
          # GitHub runs this step under `bash -e`, which would abort on the
          # failing pipeline before the annotations below could be emitted.
          set +e
          fastlane ci_testflight 2>&1 | tee /tmp/fastlane.log
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::fastlane ci_testflight exited $status. Last lines follow:"
            # One annotation per line: a multi-line ::error:: payload is
            # truncated to its first line, which is exactly the part that
            # usually says nothing useful.
            tail -n 30 /tmp/fastlane.log | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/}"
              [ -n "$line" ] && echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Upload exported distribution certificate (one-time setup)
        # Only produced when a new certificate was created AND
        # DIST_CERT_PASSWORD is set — see the Fastfile. Download this once,
        # store its contents as the DIST_CERT_P12 secret, and every later run
        # reuses that certificate instead of consuming a new slot from Apple's
        # limit of 2. The .p12 is passphrase-encrypted, but it is still key
        # material: delete this artifact once the secret is saved.
        #
        # always(): the certificate is created early in the Fastlane lane, so a
        # later failure (archive, upload, whatever) must not skip this step --
        # the key only exists on this runner, and skipping the upload burns a
        # certificate slot permanently. This already happened once.
        if: always() && steps.secrets_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Globbed rather than a fixed path: fastlane resolves relative paths
          # against an inconsistent working directory, and a missed export here
          # silently costs one of Apple's 2 certificate slots.
          name: distribution-certificate-p12-base64
          path: frontend/**/dist.p12.base64
          if-no-files-found: warn
          retention-days: 1

      - name: Upload IPA as build artifact
        # Kept alongside the TestFlight upload so a build is still
        # downloadable/inspectable from the Actions run itself — including when
        # the archive succeeded but the upload to Apple failed, which is
        # exactly when having the .ipa on hand is most useful.
        if: always() && steps.secrets_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: KFlex_iOS_IPA
          path: frontend/ios/build/ipa/*.ipa
          if-no-files-found: warn
