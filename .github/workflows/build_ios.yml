name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build, Sign & Upload iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check required signing secrets
        # Lets this workflow keep running green on every push before the App
        # Store Connect API key exists yet, instead of failing outright.
        # Add APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8
        # (base64 of the .p8 file) and APPLE_TEAM_ID as repo secrets
        # (Settings > Secrets and variables > Actions) to turn on signed
        # builds + automatic TestFlight/App Store Connect upload.
        id: secrets_check
        run: |
          if [ -n "${{ secrets.APPSTORE_API_KEY_ID }}" ] && \
             [ -n "${{ secrets.APPSTORE_API_ISSUER_ID }}" ] && \
             [ -n "${{ secrets.APPSTORE_API_KEY_P8 }}" ] && \
             [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed iOS build skipped — missing one or more of APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8, APPLE_TEAM_ID repository secrets."
          fi

      - name: Setup Java
        if: steps.secrets_check.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.secrets_check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend
          flutter pub get

      - name: Wire GoogleService-Info.plist and Distribution signing into the Xcode project
        # A file just sitting in ios/Runner/ isn't enough — Xcode only bundles
        # resources it has a project.pbxproj reference for, and that reference
        # is normally created by dragging the file into Xcode interactively.
        # There's no Xcode UI in CI, so add it programmatically instead
        # (hand-editing project.pbxproj's UUID-linked format by hand is a
        # well-known way to silently corrupt the whole Xcode project).
        #
        # Signing stays Automatic (both the build setting and the project-level
        # TargetAttributes.ProvisioningStyle that Xcode's "Automatically manage
        # signing" checkbox controls -- xcodebuild cross-checks the two, and a
        # mismatch is itself reported as a provisioning conflict). Automatic is
        # required here: -allowProvisioningUpdates can only create/download
        # profiles under Automatic signing. Under Manual, xcodebuild expects a
        # profile you supply yourself and fails outright when none is set.
        #
        # CODE_SIGN_IDENTITY is deliberately *deleted* rather than pinned to
        # "Apple Distribution": Automatic signing chooses the identity itself
        # and rejects any explicit value as a conflicting setting. What steers
        # it to a distribution profile instead of a development one is the
        # entitlements file's aps-environment=production -- a "development"
        # value there constrains the match to an iOS App Development profile,
        # which also requires a registered device UDID the team may not have.
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend/ios
          gem install xcodeproj --no-document
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('Runner.xcodeproj')
            target = project.targets.find { |t| t.name == 'Runner' }
            group = project.main_group['Runner']
            existing = group.files.find { |f| f.path == 'GoogleService-Info.plist' }
            file_ref = existing || group.new_reference('GoogleService-Info.plist')
            unless target.resources_build_phase.files_references.include?(file_ref)
              target.resources_build_phase.add_file_reference(file_ref)
            end
            target.build_configurations.each do |config|
              next unless config.name == 'Release'
              config.build_settings['CODE_SIGN_STYLE'] = 'Automatic'
              config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
              config.build_settings.delete('CODE_SIGN_IDENTITY')
              config.build_settings.delete('CODE_SIGN_IDENTITY[sdk=iphoneos*]')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
            attrs = project.root_object.attributes['TargetAttributes'] ||= {}
            attrs[target.uuid] ||= {}
            attrs[target.uuid]['ProvisioningStyle'] = 'Automatic'
            project.save
          "

      - name: Compile Flutter (unsigned) to generate Xcode build config
        # Populates ios/Flutter/Generated.xcconfig with the Dart AOT output
        # and --dart-define values the archive step below then reuses —
        # xcodebuild archive re-runs Flutter's build script phase, but reads
        # its config from here rather than from CLI flags of its own.
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend
          flutter build ios --release --no-codesign --dart-define=USE_LOCAL_BACKEND=false --dart-define=PROJECT_ID=kvision-503115

      - name: Import App Store Connect API key
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPSTORE_API_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      - name: Archive (auto-signed via App Store Connect API key)
        # DEVELOPMENT_TEAM applies harmlessly across the whole build
        # (dependency targets ignore it). CODE_SIGN_STYLE/CODE_SIGN_IDENTITY/
        # CODE_SIGN_ENTITLEMENTS are NOT passed here — they're set only on
        # the Runner target in project.pbxproj by the step above. Passing
        # CODE_SIGN_STYLE=Automatic globally here would fight the target's
        # own Manual setting and reintroduce the signing conflict.
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend/ios
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Write export options
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cat > frontend/ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          EOF

      - name: Export & upload to App Store Connect (TestFlight)
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          cd frontend/ios
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Upload IPA as build artifact
        # Kept alongside the App Store Connect upload above so a build is
        # still downloadable/inspectable from the Actions run even once it's
        # also live in TestFlight.
        if: steps.secrets_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BridgeFlex_iOS_IPA
          path: frontend/ios/build/ipa/*.ipa
