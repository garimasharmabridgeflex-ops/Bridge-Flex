name: Capture iOS Screenshots

# Manual only. This produces App Store screenshots; it has no business running
# on every push, and it needs no signing secrets — simulator builds are not
# code-signed, so this workflow cannot touch certificates or provisioning.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device type to match (substring, e.g. "16 Pro Max")'
        required: false
        default: '16 Pro Max'
  push:
    tags:
      - 'screenshots*'

jobs:
  screenshots:
    name: Capture on simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          WANT="${{ inputs.device }}"
          if [ -z "$WANT" ]; then
            WANT='16 Pro Max'
          fi

          echo "Available iPhone device types:"
          xcrun simctl list devicetypes | grep iPhone || true

          DEVICE_TYPE=$(xcrun simctl list devicetypes \
            | grep iPhone \
            | grep -i -- "$WANT" \
            | tail -1 \
            | sed -E 's/^.*\((.*)\)$/\1/')

          if [ -z "$DEVICE_TYPE" ]; then
            echo "::error::no simulator device type matching '$WANT'"
            exit 1
          fi
          echo "Using device type: $DEVICE_TYPE"

          UDID=$(xcrun simctl create screenshot-device "$DEVICE_TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || true

      - name: Capture screenshots
        run: |
          cd frontend
          flutter drive \
            --driver=test_driver/screenshot_driver.dart \
            --target=integration_test/screenshots_test.dart \
            -d ${{ steps.sim.outputs.udid }} \
            --dart-define=USE_LOCAL_BACKEND=false \
            --dart-define=PROJECT_ID=kvision-503115

      - name: Generate App Store compliant size classes (6.5", 6.7", 6.9")
        if: always()
        run: |
          cd frontend
          if [ ! -d screenshots ]; then echo "::warning::no screenshots directory produced"; exit 0; fi

          # Prepare output directories
          mkdir -p screenshots/6.5-inch-1284x2778
          mkdir -p screenshots/6.5-inch-1242x2688
          mkdir -p screenshots/6.7-inch-1290x2796
          mkdir -p screenshots/6.9-inch-1320x2868

          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")

            # 1) App Store 6.5" Display (1284 x 2778 px) - iPhone 12/13/14 Pro Max, 14 Plus
            sips -z 2778 1284 "$f" --out "screenshots/6.5-inch-1284x2778/$fname"

            # 2) App Store 6.5" Display (1242 x 2688 px) - iPhone XS Max, 11 Pro Max
            sips -z 2688 1242 "$f" --out "screenshots/6.5-inch-1242x2688/$fname"

            # 3) App Store 6.7" Display (1290 x 2796 px) - iPhone 14/15 Pro Max
            sips -z 2796 1290 "$f" --out "screenshots/6.7-inch-1290x2796/$fname"

            # 4) App Store 6.9" Display (1320 x 2868 px) - iPhone 16 Pro Max native
            sips -z 2868 1320 "$f" --out "screenshots/6.9-inch-1320x2868/$fname"
          done

      - name: Report captured and resized sizes
        if: always()
        run: |
          cd frontend
          if [ ! -d screenshots ]; then echo "::warning::no screenshots directory produced"; exit 0; fi

          echo "=== 6.5\" Display (1284x2778 px) ==="
          for f in screenshots/6.5-inch-1284x2778/*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "  $(basename "$f"): ${W}x${H} px"
          done

          echo "=== 6.5\" Display (1242x2688 px) ==="
          for f in screenshots/6.5-inch-1242x2688/*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "  $(basename "$f"): ${W}x${H} px"
          done

      - name: Upload 6.5-inch screenshots (App Store Connect 1284x2778)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-6.5-inch
          path: frontend/screenshots/6.5-inch-1284x2778/*.png
          if-no-files-found: warn

      - name: Upload all screenshot sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-all-sizes
          path: frontend/screenshots/
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        run: |
          xcrun simctl shutdown ${{ steps.sim.outputs.udid }} || true
          xcrun simctl delete ${{ steps.sim.outputs.udid }} || true
