name: Capture iOS Screenshots

# Manual only. This produces App Store screenshots; it has no business running
# on every push, and it needs no signing secrets — simulator builds are not
# code-signed, so this workflow cannot touch certificates or provisioning.
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device type to match (e.g. "14 Plus", "11 Pro Max", "14", "16 Pro Max")'
        required: false
        default: '14 Plus'
  push:
    tags:
      - 'screenshots*'

jobs:
  screenshots:
    name: Capture on simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          WANT="${{ inputs.device }}"
          if [ -z "$WANT" ]; then
            # Search candidate 6.5" devices in preferred order (iPhone 14 Plus, 11 Pro Max)
            for candidate in "14 Plus" "11 Pro Max" "13 Pro Max" "12 Pro Max" "14"; do
              MATCH=$(xcrun simctl list devicetypes | grep -i "iPhone" | grep -i -- "$candidate" | tail -1 || true)
              if [ -n "$MATCH" ]; then
                WANT="$candidate"
                echo "Selected 6.5\" device candidate: $candidate"
                break
              fi
            done
          fi

          if [ -z "$WANT" ]; then
            WANT="14 Plus"
          fi

          echo "Available iPhone device types on this runner:"
          xcrun simctl list devicetypes | grep iPhone || true

          DEVICE_TYPE=$(xcrun simctl list devicetypes \
            | grep iPhone \
            | grep -i -- "$WANT" \
            | tail -1 \
            | sed -E 's/^.*\((.*)\)$/\1/')

          if [ -z "$DEVICE_TYPE" ]; then
            echo "::warning::'$WANT' not found, searching fallback Plus/Pro Max..."
            DEVICE_TYPE=$(xcrun simctl list devicetypes \
              | grep iPhone \
              | grep -iE '14 Plus|11 Pro Max|13 Pro Max|Plus|Pro Max' \
              | tail -1 \
              | sed -E 's/^.*\((.*)\)$/\1/')
          fi

          if [ -z "$DEVICE_TYPE" ]; then
            echo "::error::no suitable iPhone device type found"
            exit 1
          fi
          echo "Using device type: $DEVICE_TYPE"

          UDID=$(xcrun simctl create screenshot-device "$DEVICE_TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" || true

      - name: Capture screenshots
        run: |
          cd frontend
          flutter drive \
            --driver=test_driver/screenshot_driver.dart \
            --target=integration_test/screenshots_test.dart \
            -d ${{ steps.sim.outputs.udid }} \
            --dart-define=USE_LOCAL_BACKEND=false \
            --dart-define=PROJECT_ID=kvision-503115

      - name: Strip Alpha Channels and Generate 6.5" App Store Screenshots
        if: always()
        run: |
          cd frontend
          if [ ! -d screenshots ]; then echo "::warning::no screenshots directory produced"; exit 0; fi

          # Install pillow to guarantee 24-bit Truecolor RGB (Apple strictly forbids alpha channel in screenshots)
          python3 -m pip install --break-system-packages pillow || pip3 install pillow

          mkdir -p screenshots/iPhone-14-Plus-1284x2778
          mkdir -p screenshots/iPhone-11-ProMax-1242x2688

          python3 - << 'EOF'
          import os, glob
          from PIL import Image

          raw_files = [f for f in glob.glob("screenshots/*.png") if os.path.isfile(f)]
          print(f"Processing {len(raw_files)} screenshots for App Store compliance...")

          for f in sorted(raw_files):
              fname = os.path.basename(f)
              with Image.open(f) as img:
                  # 1. Convert to RGB (STRICT REQUIREMENT: completely strips alpha channel)
                  rgb_img = img.convert("RGB")
                  
                  # Overwrite original with RGB (no alpha)
                  rgb_img.save(f, "PNG", optimize=True)

                  # 2. Resample to 1284x2778 (iPhone 14 Plus / 13 Pro Max standard 6.5" display)
                  img_14plus = rgb_img.resize((1284, 2778), Image.Resampling.LANCZOS)
                  out_14plus = os.path.join("screenshots/iPhone-14-Plus-1284x2778", fname)
                  img_14plus.save(out_14plus, "PNG", optimize=True)

                  # 3. Resample to 1242x2688 (iPhone 11 Pro Max / XS Max standard 6.5" display)
                  img_11promax = rgb_img.resize((1242, 2688), Image.Resampling.LANCZOS)
                  out_11promax = os.path.join("screenshots/iPhone-11-ProMax-1242x2688", fname)
                  img_11promax.save(out_11promax, "PNG", optimize=True)

                  print(f"  {fname}: native {rgb_img.size} -> 1284x2778 & 1242x2688 (RGB 24-bit, NO alpha)")

          EOF

      - name: Report captured and resized sizes
        if: always()
        run: |
          cd frontend
          if [ ! -d screenshots ]; then echo "::warning::no screenshots directory produced"; exit 0; fi

          echo "=== iPhone 14 Plus 6.5\" Display (1284x2778 px) ==="
          for f in screenshots/iPhone-14-Plus-1284x2778/*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "  $(basename "$f"): ${W}x${H} px"
          done

          echo "=== iPhone 11 Pro Max 6.5\" Display (1242x2688 px) ==="
          for f in screenshots/iPhone-11-ProMax-1242x2688/*.png; do
            [ -f "$f" ] || continue
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            echo "  $(basename "$f"): ${W}x${H} px"
          done

      - name: Upload iPhone 14 Plus Screenshots (1284x2778)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-iPhone14Plus-1284x2778
          path: frontend/screenshots/iPhone-14-Plus-1284x2778/*.png
          if-no-files-found: warn

      - name: Upload iPhone 11 Pro Max Screenshots (1242x2688)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-iPhone11ProMax-1242x2688
          path: frontend/screenshots/iPhone-11-ProMax-1242x2688/*.png
          if-no-files-found: warn

      - name: Upload all screenshot sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-all-sizes
          path: frontend/screenshots/
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        run: |
          xcrun simctl shutdown ${{ steps.sim.outputs.udid }} || true
          xcrun simctl delete ${{ steps.sim.outputs.udid }} || true
