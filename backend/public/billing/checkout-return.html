<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bridge-Flex Billing</title>
    <meta name="theme-color" content="#0B1F45" />
    <style>
      :root {
        --ink: #0f172a;
        --muted: #64748b;
        --navy: #1b2a4a;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
      .hint {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #f1f5f9;
        font-size: 13px;
        color: #334155;
      }
      a.button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--navy);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .ok { background: rgba(16, 185, 129, 0.12); color: #059669; }
      .warn { background: rgba(245, 158, 11, 0.14); color: #b45309; }
      .info { background: rgba(37, 99, 235, 0.12); color: #2563eb; }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="mark" class="mark ok">✓</div>
      <h1 id="title">Payment complete</h1>
      <p id="copy">
        Your nursery membership is being activated. You can close this tab and
        return to the Bridge-Flex app — your plan updates automatically.
      </p>
      <div class="hint" id="hint">
        Card details are handled entirely by Stripe. Bridge-Flex never sees or
        stores them.
      </div>
      <a class="button" id="back" href="https://kvision-503115.web.app/">Open Bridge-Flex</a>
    </main>
    <script>
      // Stripe redirects here with ?status=success|cancel|portal. The page is
      // shared by the mobile app (in-app browser, closed by the user) and the
      // web app (where the button returns to the dashboard).
      var params = new URLSearchParams(window.location.search);
      var status = (params.get("status") || "success").toLowerCase();
      var mark = document.getElementById("mark");
      var title = document.getElementById("title");
      var copy = document.getElementById("copy");
      var hint = document.getElementById("hint");
      var back = document.getElementById("back");

      if (status === "cancel") {
        mark.textContent = "!";
        mark.className = "mark warn";
        title.textContent = "Checkout cancelled";
        copy.textContent =
          "No payment was taken. You can choose a plan again whenever you're ready.";
      } else if (status === "portal") {
        mark.textContent = "i";
        mark.className = "mark info";
        title.textContent = "Billing updated";
        copy.textContent =
          "Any change you made is saved. Close this tab to return to the app — your membership details refresh automatically.";
      }
      if (window.matchMedia("(max-width: 600px)").matches) {
        back.style.display = "none";
        hint.textContent += " Close this tab to return to the app.";
      }
    </script>
  </body>
</html>
