# Sized to fit a normal 8GB development machine. The previous -Xmx8G with a 4G
# metaspace asked for more than such a machine physically has, so the kernel
# killed the daemon mid-build ("Gradle build daemon disappeared unexpectedly").
# Raise these if you build on a host with substantially more RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
